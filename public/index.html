<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#123f3a" />
    <meta name="description" content="A civic information proof of concept that connects public sources to understandable explanations and constructive feedback." />
    <title>Civic Bridge · Civic information</title>
    <link rel="icon" type="image/svg+xml" href="static/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="stylesheet" href="static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#" data-route="home" aria-label="Return to home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span id="product-name">Civic Bridge</span>
      </a>
      <div class="topbar-meta">
        <button id="account-button" class="account-button" aria-label="Sign in to participate">Sign in to participate</button>
      </div>
    </header>
    <div id="ai-status-banner"></div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="sidebar-intro">
          <span class="eyebrow" data-i18n="sidebar_eyebrow">CIVIC INFORMATION</span>
          <p data-i18n="sidebar_tagline">One source. Clear meaning. A path to respond.</p>
        </div>
        <div id="sidebar-area" class="sidebar-area"></div>
        <nav class="nav-list">
          <button class="nav-item active" data-route="home"><span class="nav-icon">⌂</span><span data-i18n="nav_overview">Overview</span></button>
          <button class="nav-item" data-route="representatives"><span class="nav-icon">◎</span><span data-i18n="nav_representatives">Representatives</span></button>
          <button class="nav-item" data-route="groups"><span class="nav-icon">⁂</span><span data-i18n="nav_groups">People like you</span></button>
          <button class="nav-item" data-route="explain"><span class="nav-icon">▤</span><span data-i18n="nav_explain">Explain a source</span></button>
          <button class="nav-item" data-route="feedback"><span class="nav-icon">◌</span><span data-i18n="nav_feedback">My feedback</span></button>
          <button class="nav-item" data-route="settings"><span class="nav-icon">⚙</span><span data-i18n="nav_settings">Settings</span></button>
        </nav>
        <div class="sidebar-rule"></div>
        <div id="sidebar-records" class="sidebar-records" hidden></div>
        <div class="sidebar-footer">
          <a class="portal-link" href="/publisher" target="_blank" rel="noopener"><strong data-i18n="sidebar_portal_title">Office side: Public Information Portal ↗</strong><small data-i18n="sidebar_portal_note">Where offices publish the notices you see here.</small></a>
        </div>
      </aside>

      <main id="app" class="main-content" tabindex="-1"></main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="" defer></script>
    <script src="static/app.js" defer></script>
  </body>
</html>
