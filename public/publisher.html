<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Official public information portal: notices, offices and publication service." />
  <title>Public information portal</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="stylesheet" href="/static/publisher.css" />
</head>
<body>
  <div class="gov-strip"><div class="gov-wrap"><span id="strip-state">—</span><label class="strip-switch"><span id="strip-switch-label">Pays</span><select id="portal-country"></select></label></div></div>
  <header class="gov-header">
    <div class="gov-wrap gov-header-inner">
      <a class="gov-brand" href="/publisher"><span class="gov-seal" aria-hidden="true"><span>✦</span></span><span><strong id="brand-title">—</strong><small id="brand-subtitle">—</small></span></a>
      <div class="gov-header-actions"><span class="office-status"><i></i> <span id="status-online">—</span></span></div>
    </div>
  </header>
  <nav class="gov-nav"><div class="gov-wrap nav-inner"><a class="active" href="#notices" id="nav-notices">—</a><a href="#offices" id="nav-offices">—</a><a href="#publish" id="nav-publish">—</a><span class="nav-spacer"></span><a class="nav-resident" href="/" id="nav-resident">—</a></div></nav>
  <main class="gov-wrap portal-main">
    <section class="portal-intro"><div><p class="section-label" id="intro-label">—</p><h1 id="intro-title">—</h1><p id="intro-body">—</p></div><div class="intro-stamp"><span id="stamp-label">—</span><strong id="last-updated">—</strong><small id="stamp-note">—</small></div></section>

    <section class="portal-grid" id="notices">
      <div class="portal-content"><div class="section-heading"><div><p class="section-label" id="notices-label">—</p><h2 id="notices-title">—</h2></div><span class="record-count" id="notice-count"></span></div><div id="featured-notice" class="featured-notice"></div><div id="recent-notices" class="notice-list"></div><button type="button" class="more-button" id="more-notices" hidden>—</button></div>
      <aside class="portal-rail">
        <div class="rail-card area-card"><div class="rail-label" id="area-label">—</div><h3 id="area-name">—</h3><p id="area-region">—</p></div>
        <div class="rail-card"><div class="rail-label" id="filter-label">—</div><div id="category-filter" class="category-filter"></div></div>
      </aside>
    </section>

    <section class="office-section" id="offices"><div class="section-heading"><div><p class="section-label" id="offices-label">—</p><h2 id="offices-title">—</h2></div></div><div id="office-directory" class="office-grid"></div></section>

    <section class="publisher-section" id="publish"><div class="publisher-heading"><div><p class="section-label" id="publish-label">—</p><h2 id="publish-title">—</h2><p id="publish-body">—</p></div></div><div id="publisher-auth" class="publisher-auth"></div>
      <form id="notice-form" class="notice-form">
        <div class="form-row"><label><span id="f-office">—</span><select id="responsible_office" name="responsible_office" required></select></label><label><span id="f-category">—</span><select id="category" name="category"></select></label></div>
        <div class="form-row"><label><span id="f-title">—</span><input id="title" name="title" required /></label><label><span id="f-locality">—</span><input id="locality" name="locality" required /></label></div>
        <label><span id="f-summary">—</span><textarea id="summary" name="summary" required rows="3"></textarea></label>
        <label><span id="f-body">—</span><textarea id="body" name="body" rows="4"></textarea></label>
        <label><span id="f-ref">—</span><input id="source_url" name="source_url" /></label>
        <div class="form-footer"><p id="f-note">—</p><button class="publish-button" type="submit"><span id="f-submit">—</span><span>→</span></button></div>
      </form>
    </section>
  </main>
  <footer class="gov-footer"><div class="gov-wrap"><div><strong id="footer-title">—</strong><p id="footer-body">—</p></div><span id="footer-note">—</span></div></footer>
  <div id="publisher-toast" class="publisher-toast" role="status"></div>
  <script src="/static/publisher.js"></script>
</body>
</html>
