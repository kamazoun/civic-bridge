# Render blueprint: New -> Blueprint -> pick this repository.
# Free plan: no persistent disk (state is re-seeded on every cold start)
# and no local AI. Attach a disk and mount it at /data to keep accounts.
services:
  - type: web
    name: civic-bridge
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: CIVIC_BRIDGE_DATA_DIR
        value: /data
      - key: PYTHONUNBUFFERED
        value: "1"
